  <!-- Tipografía Oficial -->
  <text x="65" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#047857" letter-spacing="0.5">
