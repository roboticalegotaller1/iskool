<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Innovasoft AI / Cloud Circuit Crest -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="24" fill="#1E1B4B"/>
    <!-- Neural / Cloud Hexagon -->
    <path d="M 30 50 L 50 25 L 70 50 L 70 75 L 50 85 L 30 75 Z" fill="none" stroke="#6366F1" stroke-width="2.5"/>
    <!-- Interconnected Nodes -->
    <circle cx="50" cy="25" r="5" fill="#38BDF8"/>
    <circle cx="30" cy="50" r="5" fill="#818CF8"/>
    <circle cx="70" cy="50" r="5" fill="#818CF8"/>
    <circle cx="50" cy="55" r="7" fill="#A855F7"/>
    <circle cx="30" cy="75" r="5" fill="#38BDF8"/>
    <circle cx="70" cy="75" r="5" fill="#38BDF8"/>
    <circle cx="50" cy="85" r="5" fill="#C084FC"/>
    <line x1="50" y1="25" x2="50" y2="55" stroke="#38BDF8" stroke-width="2"/>
    <line x1="30" y1="50" x2="50" y2="55" stroke="#818CF8" stroke-width="2"/>
    <line x1="70" y1="50" x2="50" y2="55" stroke="#818CF8" stroke-width="2"/>
    <line x1="50" y1="55" x2="50" y2="85" stroke="#C084FC" stroke-width="2"/>
  </g>
  <!-- Typography Lockup -->
  <g transform="translate(125, 30)">
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#1E1B4B" letter-spacing="1">
      INNOVASOFT
    </text>
    <text x="0" y="47" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#4F46E5" letter-spacing="3">
      DYNAMICS CLOUD &amp; AI
    </text>
    <text x="0" y="64" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="1">
      ENTERPRISE SOFTWARE &amp; NEURAL INFRASTRUCTURE
    </text>
  </g>
</svg>
