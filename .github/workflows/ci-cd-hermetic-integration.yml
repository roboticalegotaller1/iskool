name: CI/CD Pipeline - Integración Hermética Multi-Tenant (iSkool & IBIME)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # JOB 1: QUALITY GATE (Análisis Estático, Tipos y Tests Unitarios/Herméticos)
  # ===========================================================================
  quality-gate:
    name: 🛡️ Quality Gate (Estático, Tipos & Tests Herméticos)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout del Repositorio Central
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar Entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependencias
        run: npm ci

      - name: 🔍 Guarda de Tamaño de Carga y Límites Cloud (Reglas 3 y 4)
        run: npm run guard:push

      - name: 🧱 Análisis Estático AST de Fronteras Herméticas
        run: npm run lint:boundaries

      - name: 📐 Verificación de Tipos TypeScript (Strict Mode)
        run: npx tsc --noEmit

      - name: 🧪 Ejecución de Tests Unitarios
        run: npm run test:unit

      - name: 🔒 Ejecución de Tests de Contratos e Integración Hermética
        run: npm run test:hermetic

  # ===========================================================================
  # JOB 2: E2E BROWSER (Compilación Real, Navegador Chromium & Playwright)
  # ===========================================================================
  e2e-browser:
    name: 🎭 E2E Browser Testing (Playwright Chromium)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout del Repositorio Central
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependencias
        run: npm ci

      - name: 🏗️ Compilación de Producción (Next.js Build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: 💾 Restaurar Caché de Binarios de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 🌐 Garantizar Librerías Nativas del Sistema Operativo para Chromium
        run: npx playwright install-deps chromium

      - name: 🌐 Instalar Binarios de Chromium para Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: 🚀 Ejecutar Suite E2E Real de Navegador
        run: npm run test:e2e
        env:
          CI: true

  # ===========================================================================
  # JOB 3: DEPLOY PROTOCOL (Autenticación Git Explícita y Envío Tri-Remoto)
  # ===========================================================================
  deploy-protocol:
    name: 🚀 Protocolo de Despliegue Multi-Remoto (Regla 4)
    runs-on: ubuntu-latest
    needs: [quality-gate, e2e-browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout del Repositorio Central
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependencias
        run: npm ci

      - name: 🔑 Configurar Autenticación Git Explícita y Sincronización Remota
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Configurar remoto principal con token de sesión de GitHub Actions
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/roboticalegotaller1/iskool-web-.git"

          # Configurar remotes institucionales adicionales si está disponible el PAT
          if [ -n "${{ secrets.DEPLOY_PAT }}" ]; then
            git remote add iskool "https://x-access-token:${{ secrets.DEPLOY_PAT }}@github.com/roboticalegotaller1/iskool.git" || \
            git remote set-url iskool "https://x-access-token:${{ secrets.DEPLOY_PAT }}@github.com/roboticalegotaller1/iskool.git"

            git remote add duran14 "https://x-access-token:${{ secrets.DEPLOY_PAT }}@github.com/duran14/ISkool.git" || \
            git remote set-url duran14 "https://x-access-token:${{ secrets.DEPLOY_PAT }}@github.com/duran14/ISkool.git"

            # 1. Verificación pre-push con git fetch en los 3 remotos
            echo "Realizando git fetch preventivo en los 3 remotos para certificar alineación..."
            git fetch origin main
            git fetch iskool main
            git fetch duran14 main

            # 2. Verificación estricta de paridad de linaje (HEAD debe ser ancestro directo)
            echo "Verificando paridad de linaje: commits remotos deben ser ancestros directos de HEAD..."
            for remote in origin iskool duran14; do
              REMOTE_COMMIT=$(git rev-parse $remote/main)
              if ! git merge-base --is-ancestor $REMOTE_COMMIT HEAD; then
                echo "❌ ALARMA CRÍTICA: El commit en $remote/main ($REMOTE_COMMIT) no es ancestro directo de HEAD."
                echo "   Existe un desfase o concurrencia no integrada. Despliegue abortado para prevenir divergencias."
                exit 1
              fi
              echo "✅ Paridad de linaje verificada en $remote/main."
            done

            # 3. Guarda de calidad preventiva
            npm run guard:push

            # 4. Envío atómico estándar y verificado sin force-with-lease indiscriminado
            echo "Ejecutando push verificado a origin..."
            git push origin main

            echo "Ejecutando push verificado a iskool..."
            git push iskool main

            echo "Ejecutando push verificado a duran14 (AWS Amplify)..."
            git push duran14 main
          else
            echo "DEPLOY_PAT no configurado. Validando guarda y sincronizando repositorio principal..."
            git fetch origin main
            ORIGIN_COMMIT=$(git rev-parse origin/main)
            if ! git merge-base --is-ancestor $ORIGIN_COMMIT HEAD; then
              echo "❌ ALARMA CRÍTICA: origin/main no es ancestro directo de HEAD. Despliegue abortado."
              exit 1
            fi
            npm run guard:push
            git push origin main
          fi
