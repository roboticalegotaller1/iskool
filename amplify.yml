version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - echo "SESSION_SECRET=e7b4c91a02f83d6520b174ac5d893e214fa0c6791b84e3d5029a1f7c8b36d0e4" >> .env.production
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        - rm -rf .next/cache
        - find .next -name "*.js.map" -type f -delete || true
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
