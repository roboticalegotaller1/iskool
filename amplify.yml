version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - if [ -n "$SESSION_SECRET" ]; then echo "SESSION_SECRET=$SESSION_SECRET" >> .env.production; fi
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        - rm -rf .next/cache
        - find .next -name "*.js.map" -type f -delete || true
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
